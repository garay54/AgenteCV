receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch:
    timeout: 5s

exporters:
  debug:
    verbosity: basic
  otlphttp/backend:
    endpoint: ${env:OTEL_BACKEND_ENDPOINT}
    headers:
      Authorization: ${env:OTEL_BACKEND_AUTHORIZATION}

service:
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - debug
        - otlphttp/backend
